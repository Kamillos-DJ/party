<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Hudba na přání - LIVE</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #1DB954; padding: 20px; border-radius: 15px; }
        input { width: 80%; padding: 10px; border-radius: 20px; border: none; margin-bottom: 20px; }
        .song { background: #111; margin: 10px 0; padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="check">Načítání...</h1>
        <input type="text" id="search" placeholder="Hledej skladbu...">
        <div id="queue"></div>
    </div>

<script>
    // OKAMŽITÁ KONTROLA VERZE
    document.getElementById('check').innerText = "✅ VERZE 2026 AKTIVNÍ";

    const params = new URLSearchParams(window.location.search);
    const djId = params.get('dj') || "Kamillos DJ";
    console.log("Připojeno k DJ:", djId);

    const firebaseConfig = {
        apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
        authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
        databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
        projectId: "hudba-na-tuhle-skvelou-party"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Tato cesta v databázi musí být pro každého DJ jiná
    const requestsRef = db.ref("djs/" + djId + "/requests");

    requestsRef.on("value", snap => {
        const data = snap.val();
        const queueDiv = document.getElementById("queue");
        queueDiv.innerHTML = "";
        if (data) {
            Object.values(data).forEach(s => {
                queueDiv.innerHTML += `<div class="song"><span>${s.song}</span> <b>${s.votes}</b></div>`;
            });
        } else {
            queueDiv.innerHTML = "<p>Žádné písničky ve frontě.</p>";
        }
    });
</script>
</body>
</html>
