<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudba na přání</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        .dj-header { color: #1DB954; font-weight: bold; border: 1px solid #222; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 20px; border: 2px solid #1DB954; background: #111; color: #fff; box-sizing: border-box; }
        .list-item { background: #161616; padding: 10px; margin-top: 10px; border-radius: 8px; border-left: 4px solid #1DB954; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="dj-name" class="dj-header">Načítání DJ...</div>
    <input type="text" placeholder="Zadej název skladby...">
    <div id="requests"></div>

    <script>
        // Získání DJ ID přímo z URL adresy Iframe
        const urlParams = new URLSearchParams(window.location.search);
        const currentDJ = urlParams.get('dj') || "NeznamyDJ";
        document.getElementById('dj-name').innerText = "PROFIL: " + currentDJ;

        const firebaseConfig = {
            apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
            authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
            databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
            projectId: "hudba-na-tuhle-skvelou-party"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Připojení k unikátní složce DJ
        db.ref("djs/" + currentDJ + "/requests").on("value", snap => {
            const data = snap.val();
            const container = document.getElementById("requests");
            container.innerHTML = "";
            if (data) {
                Object.values(data).forEach(item => {
                    container.innerHTML += `<div class="list-item"><span>${item.song} - ${item.artist}</span><b>${item.votes || 0}</b></div>`;
                });
            } else {
                container.innerHTML = "<p style='color:#666; text-align:center;'>Zatím žádná přání.</p>";
            }
        });
    </script>
</body>
</html>
