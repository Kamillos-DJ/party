<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudba na přání</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Tady nechte své původní styly, ty fungují skvěle */
        body { background: transparent; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 5px; }
        #guest-app { max-width: 900px; margin: auto; }
        .search-wrap { position: relative; margin-bottom: 30px; }
        input[type="text"] { width: 100%; padding: 14px 22px; border-radius: 30px; background: #111; color: #fff; border: 2px solid #1DB954; }
        .res-list { display: none; position: absolute; background: #1a1a1a; width: 100%; z-index: 100; border-radius: 15px; }
        .s-item { padding: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .flex-cols { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 280px; }
        .song-card { background: #161616; padding: 10px; border-radius: 12px; display: flex; align-items: center; margin-bottom: 8px; border-left: 4px solid var(--line); }
        .song-info { flex-grow: 1; display: flex; align-items: center; gap: 10px; }
        .song-info img { width: 45px; height: 45px; border-radius: 6px; }
        .v-btn { background: #1DB954; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        .voted { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

<div id="guest-app">
    <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Hledej na Spotify...">
        <div id="search-results" class="res-list"></div>
    </div>
    <div class="flex-cols">
        <div class="col"><h3>🔥 Aktuální fronta</h3><div id="queue-list"></div></div>
        <div class="col"><h3>✅ Odehráno</h3><div id="history-list"></div></div>
    </div>
</div>

<script>
    // --- OPRAVA: Přečtení DJ z jedné společné adresy ---
    function getCorrectDJ() {
        // Nejdřív zkusíme adresu samotného Iframe
        const urlParams = new URLSearchParams(window.location.search);
        let dj = urlParams.get('dj');

        // Pokud to v Iframe není, zkusíme se podívat "ven" na hlavní adresu Webnode
        if (!dj) {
            try {
                const parentParams = new URLSearchParams(window.parent.location.search);
                dj = parentParams.get('dj');
            } catch(e) { console.log("Nelze číst z nadřazené adresy"); }
        }

        return dj || "Zakladni_DJ"; // Pokud není nikdo, dáme základ
    }

    const djId = getCorrectDJ();
    console.log("Aktivní DJ ID:", djId);

    // --- FIREBASE NASTAVENÍ ---
    const firebaseConfig = {
        apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
        authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
        databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
        projectId: "hudba-na-tuhle-skvelou-party"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Zde se vytvoří cesta v databázi podle aktuálního DJ
    const requestsRef = db.ref("djs/" + djId + "/requests");

    // --- TVOJE FUNKČNÍ SPOTIFY LOGIKA (NEMĚNIL JSEM) ---
    let spotifyToken = "";
    async function getSpotifyToken() {
        try {
            const r = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/x-www-form-urlencoded", 
                    "Authorization": "Basic " + btoa("85eac0730fcf4117a259926c46305337:256e2c4254f34f779e1968025c2585e8") 
                },
                body: "grant_type=client_credentials"
            });
            const d = await r.json();
            spotifyToken = d.access_token;
        } catch(e) { console.error("Spotify Auth Error"); }
    }
    getSpotifyToken();

    const input = document.getElementById('search-input');
    const resDiv = document.getElementById('search-results');
    let searchTimer;

    input.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        let query = e.target.value;
        if (query.trim().length < 3) { resDiv.style.display = "none"; return; }
        searchTimer = setTimeout(() => {
            if (!spotifyToken) return;
            fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=6`, {
                headers: { "Authorization": "Bearer " + spotifyToken }
            })
            .then(r => r.json())
            .then(data => {
                resDiv.innerHTML = "";
                const tracks = data.tracks?.items || [];
                tracks.forEach(t => {
                    const img = t.album.images[2]?.url || "";
                    const item = document.createElement("div");
                    item.className = "s-item";
                    item.innerHTML = `<img src="${img}"><div><b>${t.name}</b><br><small>${t.artists[0].name}</small></div>`;
                    item.onclick = () => {
                        addRequest(t.artists[0].name, t.name, img, t.id);
                        input.value = ""; resDiv.style.display = "none";
                    };
                    resDiv.appendChild(item);
                });
                if (tracks.length > 0) resDiv.style.display = "block";
            });
        }, 400);
    });

    function addRequest(artist, song, img, id) {
        if (localStorage.getItem("voted_" + id)) return;
        requestsRef.child(id).transaction(current => {
            if (current) return { ...current, votes: (current.votes || 0) + 1 };
            return { artist, song, img, votes: 1, status: "waiting", timestamp: Date.now() };
        }, () => localStorage.setItem("voted_" + id, "1"));
    }

    window.handleVote = (id) => {
        if (localStorage.getItem("voted_" + id)) return;
        requestsRef.child(id + "/votes").transaction(v => (v || 0) + 1, () => localStorage.setItem("voted_" + id, "1"));
    };

    requestsRef.on("value", snapshot => {
        const data = snapshot.val();
        const qList = document.getElementById("queue-list");
        const hList = document.getElementById("history-list");
        qList.innerHTML = ""; hList.innerHTML = "";
        if (data) {
            Object.entries(data).sort((a,b) => b[1].votes - a[1].votes).forEach(([id, song]) => {
                const hasVoted = localStorage.getItem("voted_" + id);
                let barColor = song.status === 'accepted' ? '#1DB954' : (song.status === 'rejected' ? '#ff4444' : (song.status === 'played' ? '#444' : '#4682B4'));
                const html = `
                    <div class="song-card" style="--line: ${barColor}">
                        <div class="song-info">
                            <img src="${song.img}">
                            <div><b>${song.song}</b><br><small>${song.artist}</small></div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <b style="margin-right:10px;">${song.votes || 0}</b>
                            ${song.status !== 'played' ? `<button onclick="handleVote('${id}')" class="v-btn ${hasVoted ? 'voted' : ''}">+</button>` : ''}
                        </div>
                    </div>`;
                if (song.status === "played") hList.innerHTML += html; 
                else qList.innerHTML += html;
            });
        }
    });
</script>
</body>
</html>
