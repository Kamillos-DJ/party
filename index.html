<div id="party-app-target"></div>

<script>
    (function() {
        // 1. Vezme jméno z adresy v prohlížeči (např. Kamillos DJ)
        var nyniVProhlizeci = new URLSearchParams(window.location.search).get('dj') || 'DefaultDJ';
        
        // 2. Vytvoří Iframe a PŘIDÁ k němu to jméno + časové razítko proti staré paměti
        var cilovyKontejner = document.getElementById('party-app-target');
        var iframeUrl = "https://kamillos-dj.github.io/party/?dj=" + encodeURIComponent(nyniVProhlizeci) + "&ver=" + Date.now();
        
        cilovyKontejner.innerHTML = '<iframe src="' + iframeUrl + '" style="width:100%; height:700px; border:none; background:transparent;" allow="autoplay"></iframe>';
        
        console.log("Webnode posílá do Iframe DJ: " + nyniVProhlizeci);
    })();
</script>
