<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Kontrola</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
    body { background-color: #000; color: #fff; font-family: sans-serif; padding: 20px; }
    #dj-panel { max-width: 800px; margin: auto; }
    h1 { color: #1DB954; }
    .card { background: #222; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; transition: opacity 0.3s; }
    .req-info { display: flex; align-items: center; gap: 15px; }
    .req-info img { width: 50px; height: 50px; border-radius: 6px; }
    .controls { display: flex; gap: 8px; }
    button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    .play { background: #1DB954; color: white; }
    .played { background: #666; color: white; }
    .reject { background: #ff4444; color: white; }
    .accept { background: #4682B4; color: white; }
    .del { background: #ffaa00; color: black; }
</style>
</head>
<body>
    <div id="dj-panel">
        <h1>DJ Panel: <span id="dj-name" style="color:white;">-</span></h1>
        <div id="admin-list"></div>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const djId = urlParams.get('dj') || 'default';
    document.getElementById('dj-name').innerText = djId;
    const databasePath = "requests_" + djId;

    const cfg = {
        apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
        databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
        projectId: "hudba-na-tuhle-skvelou-party"
    };
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    const db = firebase.database();

    window.updateSongStatus = (id, newStatus) => {
        if (newStatus === 'delete') {
            db.ref(databasePath + "/" + id).remove();
        } else {
            db.ref(databasePath + "/" + id).update({ status: newStatus });
        }
    };

    db.ref(databasePath).on("value", snap => {
        const val = snap.val();
        let html = "";
        if (val) {
            Object.entries(val).sort((a,b) => b[1].votes - a[1].votes).forEach(([id, d]) => {
                const isPlayed = d.status === 'played';
                const opacity = isPlayed ? 'opacity: 0.5;' : '';
                
                html += `<div class="card" style="${opacity}">
                    <div class="req-info"><img src="${d.img}"><div><b>${d.song}</b><br><small>${d.artist} (Hlasů: ${d.votes || 0})</small></div></div>
                    <div class="controls">
                        ${!isPlayed ? `<button class="accept" onclick="updateSongStatus('${id}', 'accepted')">Schválit</button>` : ''}
                        ${!isPlayed ? `<button class="play" onclick="updateSongStatus('${id}', 'played')">Hraje</button>` : `<button class="played" onclick="updateSongStatus('${id}', 'accepted')">Vrátit</button>`}
                        <button class="reject" onclick="updateSongStatus('${id}', 'rejected')">Zamítnout</button>
                        <button class="del" onclick="updateSongStatus('${id}', 'delete')">Smazat</button>
                    </div>
                </div>`;
            });
        }
        document.getElementById("admin-list").innerHTML = html || "<p style='color:#666;text-align:center'>Žádné žádosti k vyřízení.</p>";
    });
</script>
</body>
</html>
