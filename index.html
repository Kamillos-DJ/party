        .song-card { position: relative; background: #161616; padding: 10px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border: 1px solid #222; }

    function getDJ() {
        try {
            // 1. Zkusíme hlavní adresu prohlížeče (Webnode)
            const parentParams = new URLSearchParams(window.parent.location.search);
            let dj = parentParams.get('dj');
            if (dj) return dj;

            // 2. Pokud neuspějeme, zkusíme adresu Iframe
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('dj') || "DefaultDJ";
        } catch (e) {
            // 3. Záloha, pokud prohlížeč blokuje přístup k nadřazené adrese
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('dj') || "DefaultDJ";
        }
    }
