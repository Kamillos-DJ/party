<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudba na přání</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        #dj-box { max-width: 1000px; margin: auto; background: #121212; padding: 25px; border-radius: 20px; border: 1px solid #333; }
        .search-container { display: flex; flex-direction: column; gap: 15px; }
        .search-wrapper { position: relative; width: 100%; }
        input[type="text"] { width: 100%; padding: 14px 20px; border-radius: 25px; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; border: 1px solid #333; }
        #i { border: 2px solid #1DB954; } 
        #i-tidal { border: 2px solid #00FFFF; }
        .res-box { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #252525; border-radius: 15px; margin-top: 5px; max-height: 300px; overflow-y: auto; border: 1px solid #444; z-index: 9999; }
        .s-item { padding: 10px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #333; }
        .s-item img { width: 40px; height: 40px; border-radius: 6px; }
        .lists-container { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .list-column { flex: 1; min-width: 320px; }
        .req-card { position: relative; background: #222; padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border: 1px solid #333; }
        .req-info { display: flex; align-items: center; gap: 12px; }
        .v-btn { background: #1DB954; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        h3 { color: #1DB954; font-size: 13px; text-transform: uppercase; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
    </style>
</head>
<body>
<div id="dj-box">
    <div style="text-align: center; font-size: 11px; color: #555; margin-bottom: 10px;">HRAJEŠ PRO: <span id="target-dj" style="color:#1DB954; font-weight: bold;">...</span></div>
    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="i" placeholder="Hledat a poslat přes Spotify...">
            <div id="r" class="res-box"></div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="i-tidal" placeholder="Hledat na Tidalu...">
            <div id="r-tidal" class="res-box"></div>
        </div>
    </div>
    <div class="lists-container">
        <div class="list-column"><h3>🔥 FRONTA</h3><div id="l"></div></div>
        <div class="list-column"><h3>✅ ODEHRÁNO</h3><div id="h"></div></div>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const currentDJ = urlParams.get('dj') || "Kamillos DJ"; 
document.getElementById('target-dj').innerText = currentDJ;

const cfg = {
    apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
    authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
    databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "hudba-na-tuhle-skvelou-party"
};
firebase.initializeApp(cfg);
const db = firebase.database();

let sToken = "";
async function getSToken() {
    try {
        const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://accounts.spotify.com/api/token"));
        const d = await r.json();
        const res = JSON.parse(d.contents);
        sToken = res.access_token;
    } catch(e) { console.error("Spotify Auth Error"); }
}
getSToken();

function initSearch(inputId, resId) {
    const input = document.getElementById(inputId);
    const res = document.getElementById(resId);
    let timer;
    input.addEventListener('input', (e) => {
        clearTimeout(timer);
        let v = e.target.value;
        if (v.trim().length < 3) { res.style.display = "none"; return; }
        timer = setTimeout(() => {
            if (!sToken) return;
            fetch("https://api.spotify.com/v1/search?q=" + encodeURIComponent(v), {
                headers: { "Authorization": "Bearer " + sToken }
            })
            .then(r => r.json())
            .then(j => {
                res.innerHTML = "";
                const tracks = j.tracks?.items || [];
                if (tracks.length > 0) {
                    res.style.display = "block";
                    tracks.forEach(t => {
                        const img = t.album.images[2]?.url || "";
                        const div = document.createElement("div");
                        div.className = "s-item";
                        div.innerHTML = `<img src="${img}"><div><b>${t.name}</b><small>${t.artists[0].name}</small></div>`;
                        div.onclick = () => {
                            sendReq(t.artists[0].name, t.name, img, t.id);
                            input.value = ""; res.style.display = "none";
                        };
                        res.appendChild(div);
                    });
                }
            });
        }, 400);
    });
}
initSearch('i', 'r');
initSearch('i-tidal', 'r-tidal');

function sendReq(a, s, i, id) {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("queues/" + currentDJ + "/" + id).set({
        artist: a, track: s, img: i, votes: 1, status: "waiting", timestamp: Date.now()
    }).then(() => localStorage.setItem("v_" + id, "1"));
}

window.vote = (id) => {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("queues/" + currentDJ + "/" + id + "/votes").transaction(v => (v || 0) + 1, () => localStorage.setItem("v_" + id, "1"));
};

db.ref("queues/" + currentDJ).on("value", snap => {
    const val = snap.val();
    let lH = "", hH = "";
    if (val) {
        Object.entries(val).sort((a,b) => (b[1].votes||0) - (a[1].votes||0)).forEach(([id, d]) => {
            const vtd = localStorage.getItem("v_" + id);
            const card = `<div class="req-card">
                <div class="req-info"><img src="${d.img}" width="40"><div><b>${d.track}</b><br><small>${d.artist}</small></div></div>
                <div><b>${d.votes||0}</b> ${d.status !== 'played' ? `<button onclick="vote('${id}')" class="v-btn ${vtd?'voted':''}">+</button>` : ''}</div>
            </div>`;
            if (d.status === "played") hH += card; else lH += card;
        });
    }
    document.getElementById("l").innerHTML = lH;
    document.getElementById("h").innerHTML = hH;
});
</script>
</body>
</html>
