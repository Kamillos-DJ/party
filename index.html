<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hudba na přání</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
    body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; -webkit-font-smoothing: antialiased; }
    #dj-box { max-width: 1000px; margin: auto; background: #121212; padding: 25px; border-radius: 20px; border: 1px solid #333; }
    .search-container { display: flex; flex-direction: column; gap: 5px; }
    .search-wrapper { position: relative; width: 100%; }
    .search-label { color: #bbb; font-size: 12px; margin-bottom: 8px; margin-left: 15px; font-weight: 400; letter-spacing: 0.5px; }
    input[type="text"] { width: 100%; padding: 12px 20px; border-radius: 25px; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; border: 2px solid #1DB954; }
    #banned-box { display: none; width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #ff4444; background: #330000; color: #fff; box-sizing: border-box; margin: 8px 0; font-size: 14px; text-align: center; font-weight: bold; z-index: 10000; }
    .res-box { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #252525; border-radius: 15px; margin-top: 5px; max-height: 300px; overflow-y: auto; border: 1px solid #444; z-index: 9999; }
    .s-item { padding: 10px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #333; }
    .s-item:hover { background: #333; }
    .s-item b { display: block; font-size: 15px; color: #fff; }
    .s-item img { width: 40px; height: 40px; border-radius: 6px; }
    .lists-container { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
    .list-column { flex: 1; min-width: 320px; }
    .req-card { position: relative; background: #222; padding: 7px 12px 7px 18px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; border: 1px solid #333; overflow: hidden; }
    .req-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--bar-color, #4682B4); }
    .req-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .req-info b { font-size: 15px; display: block; line-height: 1.2; color: #ffffff !important; }
    .req-info small { font-size: 12px; color: #bbb; }
    .req-info img { width: 42px; height: 42px; border-radius: 6px; flex-shrink: 0; }
    .status-tag { font-size: 9px; font-weight: 900; text-transform: uppercase; margin-right: 12px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); letter-spacing: 0.5px; }
    .st-accepted { color: #1DB954; }
    .st-rejected { color: #ff4444; }
    .st-waiting { color: #4682B4; }
    .v-btn { background: #1DB954; border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; }
    .voted { opacity: 0.2; pointer-events: none; }
    h3 { color: #1DB954; font-size: 13px; text-transform: uppercase; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; letter-spacing: 1px; }
</style>

<div id="dj-box">
    <div class="search-container">
        <div class="search-label">VYHLEDAT SPOTIFY, TIDAL</div>
        <div class="search-wrapper">
            <input type="text" id="i" placeholder="Zadej název skladby nebo interpreta...">
            <div id="r" class="res-box"></div>
        </div>
        <div id="banned-box">Vulgární výrazy nejsou povoleny !</div>
    </div>
    <div class="lists-container">
        <div class="list-column"><h3>🔥 AKTUÁLNĚ VE FRONTĚ</h3><div id="l"></div></div>
        <div class="list-column"><h3>✅ ODEHRÁNO</h3><div id="h"></div></div>
    </div>
</div>

<script>
const cfg = {
    apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
    authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
    databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
    projectId: "hudba-na-tuhle-skvelou-party"
};
firebase.initializeApp(cfg);
const db = firebase.database();

let sToken = "";
async function getSToken() {
    try {
        const r = await fetch("https://accounts.spotify.com/api/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded", "Authorization": "Basic " + btoa("85eac0730fcf4117a259926c46305337:256e2c4254f34f779e1968025c2585e8") },
            body: "grant_type=client_credentials"
        });
        const d = await r.json();
        sToken = d.access_token;
    } catch(e) { console.log("Auth error"); }
}
getSToken();

const BANNED = ["kurva", "kurev", "kurvo", "kurvy", "prcat", "mrd", "kund", "sranec", "stetka", "sracka", "suk", "mamrd", "debil", "chuj", "prdel", "zmrd", "pici", "pico", "picu", "pica", "picku", "picka", "curak", "kokot"];
const ALLOWED = ["sukynka", "sukně", "nanosekund", "milisekund", "sekund", "opičk"];

function checkBanned(text) {
    let normalized = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    let words = normalized.replace(/[.,!?;:]/g, "").split(/\s+/);
    return words.some(word => {
        let cleanWord = word;
        ALLOWED.forEach(a => { cleanWord = cleanWord.split(a.normalize("NFD").replace(/[\u0300-\u036f]/g, "")).join(""); });
        return BANNED.some(b => cleanWord.includes(b.normalize("NFD").replace(/[\u0300-\u036f]/g, "")));
    });
}

const input = document.getElementById('i');
const res = document.getElementById('r');
let timer;

input.addEventListener('input', (e) => {
    clearTimeout(timer);
    let v = e.target.value;
    if (checkBanned(v)) { 
        document.getElementById("banned-box").style.display = "block";
        setTimeout(() => document.getElementById("banned-box").style.display = "none", 1500);
        e.target.value = ""; return; 
    }
    if (v.trim().length < 3) { res.style.display = "none"; return; }
    timer = setTimeout(() => {
        if (!sToken) return;
        fetch("https://api.spotify.com/v1/search?q=" + encodeURIComponent(v) + "&type=track&limit=6", {
            headers: { "Authorization": "Bearer " + sToken }
        })
        .then(r => r.json())
        .then(j => {
            res.innerHTML = "";
            const tracks = j.tracks?.items || [];
            if (tracks.length > 0) {
                res.style.display = "block";
                tracks.forEach(t => {
                    const img = t.album.images[2]?.url || "";
                    const div = document.createElement("div");
                    div.className = "s-item";
                    div.innerHTML = '<img src="' + img + '"><div><b>' + t.name + '</b><small>' + t.artists[0].name + '</small></div>';
                    div.onclick = () => {
                        sendReq(t.artists[0].name, t.name, img, t.id, "");
                        input.value = ""; res.style.display = "none";
                    };
                    res.appendChild(div);
                });
            }
        });
    }, 400);
});

function sendReq(a, s, i, id, tidalLink = "") {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("requests/" + id).transaction(curr => {
        if (curr) return { ...curr, votes: (curr.votes || 0) + 1 };
        return { artist: a, song: s, img: i, votes: 1, status: "waiting", time: Date.now(), tidal: tidalLink };
    }, () => localStorage.setItem("v_" + id, "1"));
}

window.vote = (id) => {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("requests/" + id + "/votes").transaction(v => (v || 0) + 1, () => localStorage.setItem("v_" + id, "1"));
};

// KLÍČOVÁ OPRAVA: Naslouchání změnám s čistěním HTML
db.ref("requests").on("value", snap => {
    const val = snap.val();
    
    // Vždy vyčistit seznamy před novým vykreslením, aby se nemíchal starý obsah s novým
    document.getElementById("l").innerHTML = "";
    document.getElementById("h").innerHTML = "";
    
    let lH = "", hH = "";
    if (val) {
        Object.entries(val).sort((a,b) => b[1].votes - a[1].votes).forEach(([id, d]) => {
            const vtd = localStorage.getItem("v_" + id);
            let sTxt = d.status === 'accepted' ? 'PŘIJATO' : (d.status === 'rejected' ? 'ZAMÍTNUTO' : 'ČEKÁ');
            let sCls = d.status === 'accepted' ? 'st-accepted' : (d.status === 'rejected' ? 'st-rejected' : 'st-waiting');
            let barCol = d.status === 'accepted' ? '#1DB954' : (d.status === 'rejected' ? '#f44' : (d.status === 'played' ? '#666' : '#4682B4'));

            const card = '<div class="req-card" style="--bar-color: ' + barCol + '">' +
                '<div class="req-info"><img src="' + d.img + '"><div><b>' + d.song + '</b><small>' + d.artist + '</small></div></div>' +
                '<div style="display:flex;align-items:center;">' + 
                (d.status !== 'played' ? '<span class="status-tag ' + sCls + '">' + sTxt + '</span>' : '') +
                '<b style="font-size:16px; margin-right:12px; color: #fff;">' + (d.votes||0) + '</b>' + 
                (d.status !== 'played' ? '<button onclick="vote(\'' + id + '\')" class="v-btn ' + (vtd?'voted':'') + '">+</button>' : '') + 
                '</div>' +
            '</div>';
            if (d.status === "played") hH += card; else lH += card;
        });
        document.getElementById("l").innerHTML = lH;
        document.getElementById("h").innerHTML = hH;
    }
});
</script>
