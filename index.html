<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudba na přání</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background: transparent; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        .dj-badge { background: #1DB954; color: #000; padding: 5px 10px; border-radius: 15px; font-weight: bold; display: inline-block; margin-bottom: 15px; font-size: 12px; }
        input { width: 100%; padding: 12px; border-radius: 20px; border: 2px solid #1DB954; background: #111; color: #fff; box-sizing: border-box; }
        .song-card { background: #161616; padding: 10px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #1DB954; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="dj-display" class="dj-badge">Načítání...</div>
    <input type="text" id="search" placeholder="Hledej skladbu...">
    <div id="queue"></div>

    <script>
        // --- ABSOLUTNÍ OPRAVA: ŽÁDNÉ wnd ---
        const params = new URLSearchParams(window.location.search);
        const djId = params.get('dj') || "NeznamyDJ";
        document.getElementById('dj-display').innerText = "DJ: " + djId;

        const firebaseConfig = {
            apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
            authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
            databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
            projectId: "hudba-na-tuhle-skvelou-party"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const ref = db.ref("djs/" + djId + "/requests");

        ref.on("value", snap => {
            const data = snap.val();
            const cont = document.getElementById("queue");
            cont.innerHTML = "";
            if (data) {
                Object.values(data).forEach(s => {
                    cont.innerHTML += `<div class="song-card"><span><b>${s.song}</b><br>${s.artist}</span><span>${s.votes || 0}</span></div>`;
                });
            }
        });

        console.log("Připojeno k databázi DJ: " + djId);
    </script>
</body>
</html>
