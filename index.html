<script>
// Pomocná funkce pro získání jména DJ z URL (např. ?dj=Kamillos)
const urlParams = new URLSearchParams(window.location.search);
const djName = urlParams.get('dj') || "default"; // Pokud není v URL, použije se 'default'

const cfg = {
    apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
    authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
    databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
    projectId: "hudba-na-tuhle-skvelou-party"
};
firebase.initializeApp(cfg);
const db = firebase.database();

// Tady je ta změna: cesta v databázi teď obsahuje jméno DJ
const dbRef = db.ref("djs/" + djName + "/requests");

// ... (funkce getSToken, checkBanned a initSearch zůstávají stejné) ...

function sendReq(a, s, i, id, tidalLink = "") {
    if (localStorage.getItem("v_" + id)) return;
    dbRef.child(id).transaction(curr => {
        if (curr) return { ...curr, votes: (curr.votes || 0) + 1 };
        return { artist: a, song: s, img: i, votes: 1, status: "waiting", time: Date.now(), tidal: tidalLink };
    }, () => localStorage.setItem("v_" + id, "1"));
}

window.vote = (id) => {
    if (localStorage.getItem("v_" + id)) return;
    dbRef.child(id + "/votes").transaction(v => (v || 0) + 1, () => localStorage.setItem("v_" + id, "1"));
};

// Načítání dat specificky pro daného DJ
dbRef.on("value", snap => {
    const val = snap.val();
    document.getElementById("l").innerHTML = "";
    document.getElementById("h").innerHTML = "";
    
    let lH = "", hH = "";
    if (val) {
        Object.entries(val).sort((a,b) => b[1].votes - a[1].votes).forEach(([id, d]) => {
            const vtd = localStorage.getItem("v_" + id);
            let sTxt = d.status === 'accepted' ? 'PŘIJATO' : (d.status === 'rejected' ? 'ZAMÍTNUTO' : 'ČEKÁ');
            let sCls = d.status === 'accepted' ? 'st-accepted' : (d.status === 'rejected' ? 'st-rejected' : 'st-waiting');
            let barCol = d.status === 'accepted' ? '#1DB954' : (d.status === 'rejected' ? '#f44' : (d.status === 'played' ? '#666' : '#4682B4'));

            const card = '<div class="req-card" style="--bar-color: ' + barCol + '">' +
                '<div class="req-info"><img src="' + d.img + '"><div><b>' + d.song + '</b><small>' + d.artist + '</small></div></div>' +
                '<div style="display:flex;align-items:center;">' + 
                (d.status !== 'played' ? '<span class="status-tag ' + sCls + '">' + sTxt + '</span>' : '') +
                '<b style="font-size:16px; margin-right:12px; color: #fff;">' + (d.votes||0) + '</b>' + 
                (d.status !== 'played' ? '<button onclick="vote(\'' + id + '\')" class="v-btn ' + (vtd?'voted':'') + '">+</button>' : '') + 
                '</div>' +
            '</div>';
            if (d.status === "played") hH += card; else lH += card;
        });
        document.getElementById("l").innerHTML = lH;
        document.getElementById("h").innerHTML = hH;
    }
});
</script>
