<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif;">
    <div id="check">Načítání...</div>
    <div id="list"></div>

    <script>
        // ŽÁDNÉ wnd, ŽÁDNÉ parent. Jen čistá URL adresa.
        const urlParams = new URLSearchParams(window.location.search);
        const djId = urlParams.get('dj') || "Neznamy";
        
        document.getElementById('check').innerHTML = "Aplikace běží pro: <b>" + djId + "</b>";

        const firebaseConfig = {
            apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
            authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
            databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
            projectId: "hudba-na-tuhle-skvelou-party"
        };
        firebase.initializeApp(firebaseConfig);

        // Připojení k unikátní složce DJ v databázi
        firebase.database().ref("djs/" + djId + "/requests").on("value", snap => {
            const data = snap.val();
            let html = "";
            if (data) {
                Object.values(data).forEach(s => {
                    html += `<div style="border-bottom:1px solid #222; padding:10px;">${s.song}</div>`;
                });
            }
            document.getElementById('list').innerHTML = html || "Žádná přání.";
        });
    </script>
</body>
</html>
