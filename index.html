<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hudba na přání</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; }
        #dj-box { max-width: 800px; margin: auto; background: #121212; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 25px; background: #222; color: #fff; border: 2px solid #1DB954; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        #i-tidal { border-color: #00FFFF; }
        .res-box { background: #252525; border-radius: 10px; margin-bottom: 20px; display: none; border: 1px solid #444; max-height: 300px; overflow-y: auto; }
        .s-item { padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #333; }
        .s-item:hover { background: #333; }
        .s-item img { width: 40px; height: 40px; border-radius: 4px; }
        .s-item div { display: flex; flex-direction: column; }
        .s-item b { font-size: 15px; }
        .s-item small { color: #aaa; }
        .lists { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        .req-card { background: #222; padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; border-left: 5px solid #4682B4; }
        .req-card.played { border-left-color: #666; opacity: 0.6; }
        .req-card img { width: 45px; height: 45px; border-radius: 4px; }
        .v-btn { background: #1DB954; border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 18px; }
        h3 { font-size: 13px; color: #1DB954; text-transform: uppercase; text-align: center; border-bottom: 1px solid #333; padding-bottom: 5px; }
    </style>
</head>
<body>

<div id="dj-box">
    <input type="text" id="i" placeholder="Hledat na Spotify...">
    <div id="r" class="res-box"></div>
    
    <input type="text" id="i-tidal" placeholder="Hledat na Tidalu...">
    <div id="r-tidal" class="res-box"></div>

    <div class="lists">
        <div class="col"><h3>🔥 FRONTA</h3><div id="l"></div></div>
        <div class="col"><h3>✅ ODEHRÁNO</h3><div id="h"></div></div>
    </div>
</div>

<script>
// Tady je ta opravená adresa v kuse, aby ji nic nezkrátilo
const API = "https://worker-proud-sun-3351.kamillos-dj.workers.dev";

firebase.initializeApp({
    apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
    databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
    projectId: "hudba-na-tuhle-skvelou-party"
});
const db = firebase.database();

let token = "";
async function getToken() {
    try {
        const res = await fetch(API + "/token");
        const data = await res.json();
        token = data.access_token;
    } catch(e) { console.error("Chyba API:", e); }
}
getToken();

function setupSearch(inputId, resId) {
    const input = document.getElementById(inputId);
    const resDiv = document.getElementById(resId);
    let timeout;

    input.oninput = () => {
        clearTimeout(timeout);
        if (input.value.length < 3 || !token) return;
        
        timeout = setTimeout(async () => {
            const r = await fetch(API + "/search?query=" + encodeURIComponent(input.value));
            const j = await r.json();
            resDiv.innerHTML = "";
            resDiv.style.display = "block";
            (j.tracks?.items || []).forEach(t => {
                const img = t.album.images[2]?.url || "";
                const d = document.createElement("div");
                d.className = "s-item";
                d.innerHTML = `<img src="${img}"><div><b>${t.name}</b><small>${t.artists[0].name}</small></div>`;
                d.onclick = () => {
                    db.ref("requests/" + t.id).transaction(curr => {
                        if (curr) return { ...curr, votes: curr.votes + 1 };
                        return { song: t.name, artist: t.artists[0].name, img: img, votes: 1, status: "waiting" };
                    });
                    input.value = ""; resDiv.style.display = "none";
                };
                resDiv.appendChild(d);
            });
        }, 300);
    };
}

setupSearch("i", "r");
setupSearch("i-tidal", "r-tidal");

db.ref("requests").on("value", snap => {
    let lH = "", hH = "";
    const items = Object.entries(snap.val() || {}).sort((a,b) => b[1].votes - a[1].votes);
    items.forEach(([id, d]) => {
        const html = `<div class="req-card ${d.status === 'played' ? 'played' : ''}">
            <img src="${d.img}">
            <div style="flex:1"><b>${d.song}</b><br><small>${d.artist}</small></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <b>${d.votes}</b>
                ${d.status !== 'played' ? `<button class="v-btn" onclick="vote('${id}')">+</button>` : ''}
            </div>
        </div>`;
        if (d.status === "played") hH += html; else lH += html;
    });
    document.getElementById("l").innerHTML = lH;
    document.getElementById("h").innerHTML = hH;
});

window.vote = (id) => db.ref("requests/" + id + "/votes").transaction(v => (v || 0) + 1);
</script>
</body>
</html>
