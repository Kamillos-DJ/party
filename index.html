<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body style="background:#000; color:#fff; font-family:sans-serif; padding:20px;">
    <div id="dj-info" style="color:#1DB954; font-weight:bold; margin-bottom:20px;"></div>
    <div id="status">Připojování k databázi...</div>
    <div id="requests-list"></div>

    <script>
        // Bereme DJ jen z URL adresy Iframe
        const urlParams = new URLSearchParams(window.location.search);
        const djId = urlParams.get('dj') || "NeznamyDJ";
        document.getElementById('dj-info').innerText = "Aktivní profil: " + djId;

        const firebaseConfig = {
            apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
            authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
            databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
            projectId: "hudba-na-tuhle-skvelou-party"
        };
        firebase.initializeApp(firebaseConfig);
        
        // Cesta v databázi je teď unikátní pro každého DJ
        const dbRef = firebase.database().ref("djs/" + djId + "/requests");

        dbRef.on("value", (snapshot) => {
            document.getElementById('status').innerText = "Seznam skladeb:";
            const data = snapshot.val();
            let html = "";
            if (data) {
                Object.values(data).forEach(item => {
                    html += `<div style="padding:10px; border-bottom:1px solid #333;">${item.song} - ${item.artist}</div>`;
                });
            }
            document.getElementById('requests-list').innerHTML = html || "Zatím žádná přání.";
        }, (error) => {
            document.getElementById('status').innerText = "Chyba DB: " + error.message;
        });
    </script>
</body>
</html>
