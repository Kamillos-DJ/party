<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hudba na přání</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
    body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; -webkit-font-smoothing: antialiased; }
    #dj-box { max-width: 1000px; margin: auto; background: #121212; padding: 25px; border-radius: 20px; border: 1px solid #333; }
    .search-container { display: flex; flex-direction: column; gap: 15px; }
    .search-wrapper { position: relative; width: 100%; }
    input[type="text"] { width: 100%; padding: 14px 20px; border-radius: 25px; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; border: 1px solid #333; }
    #i { border: 2px solid #1DB954; } 
    #i-tidal { border: 2px solid #00FFFF; }
    .tidal-label { color: #00FFFF; font-size: 13px; margin-bottom: 5px; margin-left: 15px; font-weight: 300; }
    #banned-box { display: none; width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #ff4444; background: #330000; color: #fff; box-sizing: border-box; margin: 8px 0; font-size: 14px; text-align: center; font-weight: bold; z-index: 10000; }
    .res-box { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #252525; border-radius: 15px; margin-top: 5px; max-height: 400px; overflow-y: auto; border: 1px solid #444; z-index: 9999; }
    
    /* OPRAVA: Lepší odsazení v našeptávači */
    .s-item { padding: 12px 18px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #333; }
    .s-item:hover { background: #333; }
    .s-item img { width: 45px; height: 45px; border-radius: 6px; flex-shrink: 0; }
    .s-item b { display: block; font-size: 15px; color: #fff; margin-bottom: 2px; }
    .s-item small { color: #aaa; font-size: 13px; }

    .lists-container { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
    .list-column { flex: 1; min-width: 320px; }
    .req-card { position: relative; background: #222; padding: 10px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid #333; overflow: hidden; }
    .req-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--bar-color, #4682B4); }
    
    /* OPRAVA: Rozestupy v seznamu skladeb */
    .req-info { display: flex; align-items: center; gap: 15px; overflow: hidden; }
    .req-info img { width: 48px; height: 48px; border-radius: 6px; flex-shrink: 0; }
    .req-text b { display: block; font-size: 16px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .req-text small { display: block; color: #bbb; font-size: 13px; }

    .v-btn { background: #1DB954; border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 20px; font-weight: bold; transition: 0.2s; }
    .v-btn:active { transform: scale(0.9); }
    .voted { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
    h3 { color: #1DB954; font-size: 14px; text-transform: uppercase; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="dj-box">
    <div class="search-container">
        <div class="search-wrapper" id="wrap-spotify">
            <input type="text" id="i" placeholder="Hledat a poslat přes Spotify...">
            <div id="r" class="res-box"></div>
        </div>
        <div id="banned-box">Vulgární výrazy nejsou povoleny !</div>
        <div class="search-wrapper" id="wrap-tidal">
            <div class="tidal-label">Hledat a poslat přes Tidal:</div>
            <input type="text" id="i-tidal" placeholder="Hledat na Tidalu...">
            <div id="r-tidal" class="res-box"></div>
        </div>
    </div>
    <div class="lists-container">
        <div class="list-column"><h3>🔥 FRONTA</h3><div id="l"></div></div>
        <div class="list-column"><h3>✅ ODEHRÁNO</h3><div id="h"></div></div>
    </div>
</div>

<script>
const BANNED = ["kurva", "kurev", "kurvo", "kurvy", "prcat", "mrd", "kund", "sranec", "stetka", "sracka", "suk", "mamrd", "debil", "chuj", "prdel", "zmrd", "pici", "pico", "picu", "pica", "picku", "picka", "curak", "kokot"];
const ALLOWED = ["sukynka", "sukně", "nanosekund", "milisekund", "sekund", "opičk"];

firebase.initializeApp({
    apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
    databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
    projectId: "hudba-na-tuhle-skvelou-party"
});
const db = firebase.database();

let sToken = "";
async function getSToken() {
    try {
        const r = await fetch("https://accounts.spotify.com/api/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded", "Authorization": "Basic " + btoa("85eac0730fcf4117a259926c46305337:256e2c4254f34f779e1968025c2585e8") },
            body: "grant_type=client_credentials"
        });
        const d = await r.json();
        sToken = d.access_token;
    } catch(e) { console.log("Auth error"); }
}
getSToken();

function initSearch(inputId, resId, isTidal) {
    const input = document.getElementById(inputId);
    const res = document.getElementById(resId);
    let timer;

    input.addEventListener('input', (e) => {
        clearTimeout(timer);
        let v = e.target.value;
        if (v.trim().length < 3) { res.style.display = "none"; return; }

        timer = setTimeout(() => {
            if (!sToken) return;
            // OPRAVA: Použití správné adresy pro Spotify API bez uříznutého textu
            fetch("api.spotify.com/v1/..." + encodeURIComponent(v) + "&type=track&limit=8", {
                headers: { "Authorization": "Bearer " + sToken }
            })
            .then(r => r.json())
            .then(j => {
                res.innerHTML = "";
                const tracks = (j.tracks && j.tracks.items) ? j.tracks.items : [];
                if (tracks.length > 0) {
                    res.style.display = "block";
                    tracks.forEach(t => {
                       const img = t.album.images[2]?.url || "";
                       const div = document.createElement("div");
                       div.className = "s-item";
                       // OPRAVA: Přidány mezery v našeptávači
                       div.innerHTML = `<img src="${img}"><div class="s-text"><b>${t.name}</b><small>${t.artists[0].name}</small></div>`;
                       div.onclick = () => {
                           const query = encodeURIComponent(t.artists[0].name + " " + t.name);
                           const tLink = isTidal ? "https://listen.tidal.com/search?q=" + query : "";
                           sendReq(t.artists[0].name, t.name, img, t.id, tLink);
                           input.value = ""; res.style.display = "none";
                       };
                       res.appendChild(div);
                    });
                } else { res.style.display = "none"; }
            });
        }, 400);
    });
}

initSearch('i', 'r', false);
initSearch('i-tidal', 'r-tidal', true);

function sendReq(a, s, i, id, tidalLink = "") {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("requests/" + id).transaction(curr => {
        if (curr) return { ...curr, votes: (curr.votes || 0) + 1 };
        return { artist: a, song: s, img: i, votes: 1, status: "waiting", time: Date.now(), tidal: tidalLink };
    }, () => localStorage.setItem("v_" + id, "1"));
}

window.vote = (id) => {
    if (localStorage.getItem("v_" + id)) return;
    db.ref("requests/" + id + "/votes").transaction(v => (v || 0) + 1, () => localStorage.setItem("v_" + id, "1"));
};

db.ref("requests").on("value", snap => {
    const val = snap.val();
    let lH = "", hH = "";
    if (val) {
        Object.entries(val).sort((a,b) => b[1].votes - a[1].votes).forEach(([id, d]) => {
            const vtd = localStorage.getItem("v_" + id);
            // OPRAVA: Přidány mezery a formátování do seznamu skladeb
            const card = `<div class="req-card" style="--bar-color: ${d.status === 'accepted' ? '#1DB954' : d.status === 'rejected' ? '#f44' : (d.status === 'played' ? '#666' : '#4682B4')}">
                <div class="req-info">
                    <img src="${d.img}">
                    <div class="req-text">
                        <b>${d.song}</b>
                        <small>${d.artist}</small>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:15px;">
                    <b style="font-size: 18px; color: #1DB954;">${d.votes||0}</b>
                    ${d.status !== 'played' ? `<button onclick="vote('${id}')" class="v-btn ${vtd?'voted':''}">+</button>` : ''}
                </div>
            </div>`;
            if (d.status === "played") hH += card; else lH += card;
        });
    }
    document.getElementById("l").innerHTML = lH;
    document.getElementById("h").innerHTML = hH;
});
</script>
</body>
</html>
