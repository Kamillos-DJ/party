<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Music Player</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
        .search-container { position: sticky; top: 0; background: #000; padding-bottom: 15px; z-index: 100; }
        .search { width: 100%; padding: 18px; border-radius: 30px; border: 2px solid #1DB954; background: #121212; color: #fff; box-sizing: border-box; font-size: 16px; outline: none; }
        .res { background: #181818; border-radius: 15px; display: none; margin: 10px 0; max-height: 350px; overflow-y: auto; border: 1px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .track { padding: 12px; border-bottom: 1px solid #282828; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s; }
        .track:hover { background: #282828; }
        .track img { width: 50px; height: 50px; border-radius: 4px; }
        .cols { display: flex; gap: 20px; margin-top: 20px; }
        .col { flex: 1; min-width: 0; }
        .card { background: #181818; padding: 12px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-left: 4px solid #1DB954; animation: fadeIn 0.3s ease; }
        .btn { background: #1DB954; border: none; color: #fff; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; font-weight: bold; font-size: 20px; flex-shrink: 0; margin-left: 10px; }
        .btn:active { transform: scale(0.9); }
        h3 { font-size: 14px; color: #1DB954; text-align: center; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; }
        small { color: #b3b3b3; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="sin" class="search" placeholder="Najdi svou pecku na Spotify...">
        <div id="sres" class="res"></div>
    </div>

    <div class="cols">
        <div class="col"><h3>🔥 FRONTA</h3><div id="q"></div></div>
        <div class="col"><h3>✅ ODEHRÁNO</h3><div id="h"></div></div>
    </div>

<script>
    // 1. Získání DJ ID z adresy
    const urlParams = new URLSearchParams(window.location.search);
    const djId = urlParams.get('dj') || 'default_party';
    const path = "requests_" + djId;

    // 2. Firebase Konfigurace
    const firebaseConfig = {
        apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
        databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
        projectId: "hudba-na-tuhle-skvelou-party"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 3. Spotify Autentizace (Token)
    let spotifyToken = "";
    async function refreshSpotifyToken() {
        try {
            const response = await fetch("https://accounts.spotify.com/api/token", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Authorization": "Basic " + btoa("85eac0730fcf4117a259926c46305337:256e2c4254f34f779e1968025c2585e8") 
                },
                body: "grant_type=client_credentials"
            });
            const data = await response.json(); 
            spotifyToken = data.access_token;
        } catch(e) { console.error("Spotify Auth Error"); }
    }
    refreshSpotifyToken();

    // 4. Vyhledávání písniček
    const inputField = document.getElementById('sin');
    const resultsDiv = document.getElementById('sres');
    let typingTimer;

    inputField.oninput = () => {
        clearTimeout(typingTimer);
        if (inputField.value.length < 3) { resultsDiv.style.display='none'; return; }
        
        typingTimer = setTimeout(() => {
            fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(inputField.value)}&type=track&limit=6`, {
                headers: { "Authorization": "Bearer " + spotifyToken }
            }).then(r=>r.json()).then(data=>{
                resultsDiv.innerHTML = "";
                const items = data.tracks?.items || [];
                if (items.length > 0) {
                    resultsDiv.style.display='block';
                    items.forEach(t => {
                        const trackEl = document.createElement('div');
                        trackEl.className = 'track';
                        trackEl.innerHTML = `<img src="${t.album.images[2]?.url || ''}"><div><b>${t.name}</b><br><small>${t.artists[0].name}</small></div>`;
                        trackEl.onclick = () => {
                            db.ref(path + "/" + t.id).transaction(current => {
                                if (current) return { ...current, v: (current.v || 1) + 1 };
                                return { a: t.artists[0].name, s: t.name, i: t.album.images[2]?.url || '', v: 1, st: "w" };
                            });
                            inputField.value = ""; resultsDiv.style.display='none';
                        };
                        resultsDiv.appendChild(trackEl);
                    });
                }
            });
        }, 400);
    };

    // 5. Hlasování (Plus tlačítko)
    window.addVote = (id) => {
        db.ref(path + "/" + id + "/v").transaction(v => (v || 0) + 1);
    };

    // 6. Načítání dat v reálném čase
    db.ref(path).on('value', snapshot => {
        const data = snapshot.val();
        let queueHtml = "", historyHtml = "";
