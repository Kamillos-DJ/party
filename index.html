<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body style="background:transparent; color:#fff; font-family:sans-serif;">
    <div id="status">Připojování...</div>
    <div id="output"></div>

    <script>
        // Čisté načtení parametrů bez ohledu na Webnode
        const urlParams = new URLSearchParams(window.location.search);
        const djId = urlParams.get('dj') || "Neznamy";

        const firebaseConfig = {
            apiKey: "AIzaSyAMb87-JHDqlUFghfCgT9ch91WlLbHzFv4",
            authDomain: "hudba-na-tuhle-skvelou-party.firebaseapp.com",
            databaseURL: "https://hudba-na-tuhle-skvelou-party-default-rtdb.firebaseio.com",
            projectId: "hudba-na-tuhle-skvelou-party"
        };
        firebase.initializeApp(firebaseConfig);
        
        document.getElementById('status').innerText = "Aktivní DJ: " + djId;

        // Načítání dat z unikátní složky DJ
        firebase.database().ref("djs/" + djId + "/requests").on("value", snap => {
            const list = snap.val();
            let html = "";
            if(list) {
                Object.values(list).forEach(s => {
                    html += `<div>${s.song} (Hlasů: ${s.votes || 0})</div>`;
                });
            }
            document.getElementById('output').innerHTML = html || "Žádné písničky.";
        });
    </script>
</body>
</html>
