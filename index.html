<div style="width: 100%; text-align: center;">
    <iframe 
        id="party-frame"
        src="https://kamillos-dj.github.io/party/" 
        style="width: 100%; height: 800px; border: none; background: transparent;"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen">
    </iframe>
</div>

<script>
// Oprava adresy s DJ jménem
const params = new URLSearchParams(window.location.search);
const dj = params.get('dj') || "Kamillos DJ";
const frame = document.getElementById('party-frame');
frame.src = "https://kamillos-dj.github.io/party/?dj=" + encodeURIComponent(dj) + "&v=" + Date.now();
</script>
